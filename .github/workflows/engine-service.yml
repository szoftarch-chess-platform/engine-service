# Checks and tests every pull request and every push to dev and main, and builds the image.
# A version tag such as v1.0.0 also publishes the image for amd64 and arm64, as ADR-2 decides.

name: Engine service

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run unit and real-engine tests
        env:
          STOCKFISH_PATH: /usr/games/stockfish
        run: python -m pytest tests -q

      - name: Build Docker image
        run: docker build -t engine-service:test .

      - name: Start container
        run: |
          docker run --detach --init \
            --name engine-service-test \
            --publish 8000:8000 \
            --env PORT=8000 \
            --env HOST=0.0.0.0 \
            --env STOCKFISH_DEPTH=10 \
            engine-service:test

      - name: Smoke test container
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:8000 --timeout 60

      - name: Stop container
        if: always()
        run: docker rm --force engine-service-test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the GitHub Container Registry
        if: env.RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image tag is the version number of the git tag without the v.
      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/szoftarch-chess-platform/engine-service
          tags: type=semver,pattern={{version}}

      # Without a version tag the image is only built, for the platform of the runner.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.RELEASE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
